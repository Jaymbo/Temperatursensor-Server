<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="32" height="32">
  <g stroke="#007bff" stroke-width="2.5" stroke-linecap="round" fill="none" transform="translate(50,50) scale(1.2) translate(-50,-50)">
    <!-- Ein Strahl mit 3 Zacken (nach oben) -->
    <g id="arm">
      <line x1="50" y1="12" x2="50" y2="50"/>
      <!-- Zacken: kurz-lang, Spitze zur Mitte -->
      <polyline points="44,22 50,26 56,22"/>
      <polyline points="43,32 50,35 57,32"/>
    </g>
    <!-- 6 Strahlen -->
    <use href="#arm"/>
    <use href="#arm" transform="rotate(60,50,50)"/>
    <use href="#arm" transform="rotate(120,50,50)"/>
    <use href="#arm" transform="rotate(180,50,50)"/>
    <use href="#arm" transform="rotate(240,50,50)"/>
    <use href="#arm" transform="rotate(300,50,50)"/>
  </g>
</svg>